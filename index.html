<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 페이지 상단 헤더 영역 -->
  <header>
    <div class="logo">☕</div>
    <h1>바이브 카페</h1>
    <p>당신의 하루에 바이브를 더하다</p>

    <!-- 탭 메뉴 (☕ 주문하기 / 📋 주문 내역) -->
    <nav class="tab-menu">
      <button type="button" class="tab-btn active" id="tabOrderBtn">☕ 주문하기</button>
      <button type="button" class="tab-btn" id="tabHistoryBtn">
        📋 주문 내역 <span class="order-badge" id="orderCountBadge">0</span>
      </button>
    </nav>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main>
    <!-- [탭 1] 주문하기 영역 -->
    <section id="orderSection">
      <!-- 주문서 폼 (novalidate: JavaScript로 직접 유효성 검사 수행) -->
      <form id="orderForm" novalidate>
        <!-- 1. 주문자 이름 -->
        <div class="form-group">
          <label for="userName">이름 (필수)</label>
          <input type="text" id="userName" name="userName" placeholder="이름을 입력하세요">
        </div>

        <!-- 2. 전화번호 -->
        <div class="form-group">
          <label for="userPhone">전화번호</label>
          <input type="tel" id="userPhone" name="userPhone" placeholder="010-0000-0000">
        </div>

        <!-- 3. 음료 선택 드롭다운 -->
        <div class="form-group">
          <label for="drinkSelect">음료 선택</label>
          <select id="drinkSelect" name="drink">
            <option value="" data-price="0">-- 음료를 선택하세요 --</option>
            <option value="americano" data-price="3500">아메리카노 3,500원</option>
            <option value="latte" data-price="4000">카페라떼 4,000원</option>
            <option value="mocha" data-price="4500">카페모카 4,500원</option>
            <option value="vanillaLatte" data-price="4500">바닐라라떼 4,500원</option>
            <option value="greenTeaLatte" data-price="4500">녹차라떼 4,500원</option>
            <option value="chocoSmoothie" data-price="5000">초코스무디 5,000원</option>
            <option value="strawberrySmoothie" data-price="5000">딸기스무디 5,000원</option>
          </select>
        </div>

        <!-- 4. 사이즈 선택 (라디오 버튼) -->
        <fieldset class="form-group">
          <legend>사이즈</legend>
          <input type="radio" id="sizeS" name="size" value="S" data-price="0">
          <label for="sizeS">S +0원</label>

          <input type="radio" id="sizeM" name="size" value="M" data-price="500" checked>
          <label for="sizeM">M +500원</label>

          <input type="radio" id="sizeL" name="size" value="L" data-price="1000">
          <label for="sizeL">L +1,000원</label>
        </fieldset>

        <!-- 5. 추가 옵션 (체크박스) -->
        <fieldset class="form-group">
          <legend>추가 옵션</legend>
          <input type="checkbox" id="optShot" name="extraOption" value="shot" data-price="500">
          <label for="optShot">샷 추가 +500원</label>

          <input type="checkbox" id="optCream" name="extraOption" value="cream" data-price="500">
          <label for="optCream">크림 추가 +500원</label>

          <input type="checkbox" id="optSyrup" name="extraOption" value="syrup" data-price="300">
          <label for="optSyrup">시럽 추가 +300원</label>

          <input type="checkbox" id="optDecaf" name="extraOption" value="decaf" data-price="0">
          <label for="optDecaf">디카페인 +0원</label>
        </fieldset>

        <!-- 6. 수량 -->
        <div class="form-group">
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <!-- 7. 요청사항 -->
        <div class="form-group">
          <label for="requests">요청사항</label>
          <textarea id="requests" name="requests" rows="4" placeholder="요청사항을 입력해주세요"></textarea>
        </div>

        <!-- 8. 예상 금액 표시 영역 -->
        <div id="priceDisplay" class="price-display">
          예상 금액: <span id="totalPrice">0</span>원
        </div>

        <!-- 9 & 10. 주문하기 / 다시 작성 버튼 -->
        <div class="form-actions">
          <button type="submit" id="submitBtn">주문하기</button>
          <button type="reset" id="resetBtn">다시 작성</button>
        </div>
      </form>

      <!-- 11. 주문 확인 메시지 표시 영역 (초기 상태 숨김) -->
      <div id="orderConfirmation" class="order-confirmation" hidden></div>
    </section>

    <!-- [탭 2] 주문 내역 영역 (초기 상태 숨김) -->
    <section id="historySection" class="hidden" hidden>
      <!-- 주문 내역이 없을 때 표시되는 문구 -->
      <div id="emptyNotice" class="empty-notice">
        아직 주문 내역이 없어요 ☕
      </div>

      <!-- 접수된 주문 카드가 렌더링되는 목록 영역 -->
      <div id="ordersList" class="orders-list"></div>

      <!-- 총 주문 금액 및 전체 삭제 영역 -->
      <div id="historySummary" class="history-summary hidden" hidden>
        <span class="summary-text" id="totalSummaryText">총 주문 금액: 0원 (0건)</span>
        <button type="button" id="clearAllBtn" class="clear-all-btn">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase JS v2 라이브러리 CDN 연결 (script.js보다 먼저 실행) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 자바스크립트 연결 -->
  <script src="script.js"></script>
</body>
</html>
